<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Hossein Shirali, Computer Vision and Machine Learning Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3CFDB"/>
      <stop offset="0.5" stop-color="#D6E4F2"/>
      <stop offset="1" stop-color="#9FDCD8"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath>
    <style>
      .name { font: 700 64px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #14213D; letter-spacing: -1px; }
      .role { font: 500 26px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #24456B; }
      .tag  { font: 500 19px 'Cascadia Code', Consolas, 'Courier New', monospace; fill: #1F7A75; opacity: 0; }
      .t1 { animation: cycle 12s infinite; }
      .t2 { animation: cycle 12s infinite 4s; }
      .t3 { animation: cycle 12s infinite 8s; }
      @keyframes cycle { 0% { opacity: 0; } 4% { opacity: 1; } 30% { opacity: 1; } 34% { opacity: 0; } 100% { opacity: 0; } }
      .node { fill: #14213D; opacity: 0.55; }
      .edge { stroke: #14213D; stroke-opacity: 0.18; stroke-width: 1.5; }
      .box  { fill: none; stroke: #1F7A75; stroke-width: 2.5; stroke-dasharray: 10 6; animation: dash 6s linear infinite; }
      .lbl  { font: 600 14px 'Cascadia Code', Consolas, monospace; fill: #FFFFFF; }
      @keyframes dash { to { stroke-dashoffset: -160; } }
      @media (prefers-reduced-motion: reduce) { .t1, .t2, .t3, .box { animation: none; } .t1 { opacity: 1; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <path d="M0 250 C 220 200, 420 300, 640 250 S 1000 190, 1200 240 L1200 300 L0 300 Z" fill="url(#wave)"/>
    <path d="M0 275 C 260 240, 520 310, 780 270 S 1080 245, 1200 265 L1200 300 L0 300 Z" fill="#FFFFFF" fill-opacity="0.35"/>

    <!-- A small neural-network motif with a detection box: the two sides of the work. -->
    <g transform="translate(860 52)">
      <line class="edge" x1="20" y1="30" x2="120" y2="10"/><line class="edge" x1="20" y1="30" x2="120" y2="80"/>
      <line class="edge" x1="20" y1="30" x2="120" y2="150"/><line class="edge" x1="20" y1="110" x2="120" y2="10"/>
      <line class="edge" x1="20" y1="110" x2="120" y2="80"/><line class="edge" x1="20" y1="110" x2="120" y2="150"/>
      <line class="edge" x1="20" y1="180" x2="120" y2="80"/><line class="edge" x1="20" y1="180" x2="120" y2="150"/>
      <line class="edge" x1="120" y1="10" x2="220" y2="60"/><line class="edge" x1="120" y1="80" x2="220" y2="60"/>
      <line class="edge" x1="120" y1="150" x2="220" y2="60"/><line class="edge" x1="120" y1="10" x2="220" y2="140"/>
      <line class="edge" x1="120" y1="80" x2="220" y2="140"/><line class="edge" x1="120" y1="150" x2="220" y2="140"/>
      <circle class="node" cx="20" cy="30" r="7"/><circle class="node" cx="20" cy="110" r="7"/><circle class="node" cx="20" cy="180" r="7"/>
      <circle class="node" cx="120" cy="10" r="7"/><circle class="node" cx="120" cy="80" r="7"/><circle class="node" cx="120" cy="150" r="7"/>
      <circle class="node" cx="220" cy="60" r="7"/><circle class="node" cx="220" cy="140" r="7"/>
      <rect class="box" x="92" y="-18" width="160" height="196" rx="6"/>
      <rect x="92" y="-40" width="118" height="22" rx="4" fill="#1F7A75"/>
      <text class="lbl" x="100" y="-24">vision 0.99</text>
    </g>

    <text class="name" x="64" y="118">Hossein Shirali</text>
    <text class="role" x="66" y="162">Computer Vision &amp; Machine Learning Engineer</text>
    <text class="tag t1" x="66" y="208">&gt; Deep Learning · 3D Perception · Robotic Imaging</text>
    <text class="tag t2" x="66" y="208">&gt; End-to-end vision systems, from models to hardware</text>
    <text class="tag t3" x="66" y="208">&gt; PhD (Dr.-Ing.) @ Karlsruhe Institute of Technology</text>
  </g>
</svg>
